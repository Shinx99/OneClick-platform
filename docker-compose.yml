version: '3.8'

services:
  # --- INFRASTRUCTURE ---
  eureka-server:
    image: steeltoeoss/eureka-server
    ports:
      - "8761:8761"
    networks:
      - oneclick-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-auth:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB_AUTH}
      POSTGRES_USER: ${POSTGRES_USER_AUTH}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_AUTH}
    ports:
      - "5432:5432"
    volumes:
      - postgres-auth-data:/var/lib/postgresql/data
    networks:
      - oneclick-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER_AUTH} -d ${POSTGRES_DB_AUTH}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-recruitment:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB_RECRUITMENT}
      POSTGRES_USER: ${POSTGRES_USER_RECRUITMENT}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_RECRUITMENT}
    ports:
      - "5433:5432"
    volumes:
      - postgres-recruitment-data:/var/lib/postgresql/data
    networks:
      - oneclick-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER_RECRUITMENT} -d ${POSTGRES_DB_RECRUITMENT}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-gateway:
    image: redis:7-alpine
    ports:
      - "6378:6379"
    volumes:
      - redis-gateway-data:/data
    networks:
      - oneclick-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-auth:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-auth-data:/data
    networks:
      - oneclick-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-recruitment:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis-recruitment-data:/data
    networks:
      - oneclick-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - oneclick-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- MICROSERVICES ---
  auth-service:
    build: ./services/OneClick-authService-be
    ports:
      - "8081:8081"
    env_file: .env
    depends_on:
      postgres-auth:
        condition: service_healthy
      redis-auth:
        condition: service_healthy
    networks:
      - oneclick-network

  recruitment-service:
    build: ./services/OneClick-recruitmentService-be
    ports:
      - "8082:8082"
    env_file: .env
    depends_on:
      postgres-recruitment:
        condition: service_healthy
      redis-recruitment:
        condition: service_healthy
    networks:
      - oneclick-network

  gateway-service:
    build: ./services/OneClick-gatewayService
    ports:
      - "8080:8080"
    env_file: .env
    depends_on:
      redis-gateway:
        condition: service_healthy
      auth-service:
        condition: service_started
      recruitment-service:
        condition: service_started
    networks:
      - oneclick-network

  auth-frontend:
    build: ./services/OneClick-authService-fe
    ports:
      - "3000:3000"
    env_file: .env
    networks:
      - oneclick-network

networks:
  oneclick-network:
    external: true

volumes:
  postgres-auth-data:
  postgres-recruitment-data:
  redis-gateway-data:
  redis-auth-data:
  redis-recruitment-data:
  minio-data: